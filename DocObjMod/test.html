<!DOCTYPE html>
<html lang="en">   
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document Object Model</title>
        <link rel="stylesheet" href="test.css">
    </head>
    <body>
        <form>
            <label for="lastname">Last Name:</label>
            <input id="lastname" type="text" name="lastname" required=True label="Last Name:" ><br>
            <label for="firstname">First Name:</label>
            <input id="firstname" type="text" name="firstname" required=True ><br>
            <label for="midInitial">Middle Initial:</label>
            <input type="text" name="middleInitial" ><br>
            <label for="age">Age:</label>
            <input id="age" type="number" name="age" required=True ><br>
            <script>
                document.querySelector('form').addEventListener('submit', function(e) {
                    e.preventDefault();
                    const age = parseInt(document.querySelector('input[name="age"]').value);
                    if (age < 18) {
                        alert("Underage");
                    } else {
                        alert("Welcome!");
                    }
                });
            </script>
            <label for="weight">Weight:</label>
            <input id="weight" type="number" name="weight" required=True ><br>
            <script>
                document.querySelector('form').addEventListener('submit', function(e){
                    e.preventDefault();
                    const weight = parseInt(document.querySelector('input[name="weight"]').value);
                    if (weight < 80){
                        alert("Underweight!")                    
                    }
                    else if (weight > 300){
                        alert("Overweight!");
                    }
                    else if (weight in range(80,300)){
                        alert("Welcome!")
                    }
                    
                });
            </script>
            <button type="submit" name="Submit" aria-placeholder="Submit">Submit</button>
        </form>
    </body>
</html>
